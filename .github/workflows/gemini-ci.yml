# Fork CI for GeminiCode (see gemini/README.md, "CI").
# Compiles the fork, builds and tests extensions/gemini, runs hygiene, and
# checks the unauthenticated `gemini --acp` initialize handshake. No packaged builds yet.
# The full compile is skipped on pull requests that only touch GeminiCode's own
# files (the extension job covers those), and node_modules is restored from a
# cache keyed on the lockfiles, so most pull requests finish in a few minutes.
name: Gemini CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      upstream: ${{ steps.diff.outputs.upstream }}
    steps:
      - name: Check whether upstream files changed
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # Pushes to main and manual runs always compile everything.
          if [ -z "$PR" ]; then
            echo "upstream=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
          echo "$files"
          # GeminiCode's own files; anything else may affect the full compile.
          other=$(echo "$files" | grep -Ev '^(extensions/gemini/|gemini/|\.github/workflows/gemini-|[^/]*\.md$)' || true)
          if [ -n "$other" ]; then
            echo "upstream=true" >> "$GITHUB_OUTPUT"
          else
            echo "upstream=false" >> "$GITHUB_OUTPUT"
          fi

  extension:
    name: Gemini extension
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        gemini-cli: [latest, preview]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install root and build tooling (no native modules)
        run: |
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix build

      - name: Install extension dependencies
        run: |
          npm ci --ignore-scripts --prefix extensions
          npm ci --prefix extensions/gemini

      - name: Lint fork files
        run: npx eslint --max-warnings 0 extensions/gemini gemini/site build/hygiene.ts build/filters.ts build/npm/dirs.ts build/gulpfile.extensions.ts build/lib/extensions.ts

      - name: Hygiene (fork files)
        run: node build/hygiene.ts product.json .eslint-ignore build/lib/extensions.ts $(git ls-files extensions/gemini gemini .github/workflows/gemini-ci.yml)

      - name: Compile extension
        run: npm run gulp compile-extension:gemini

      - name: Build the download page (sample release)
        run: node gemini/site/build.mts "$RUNNER_TEMP/site" --sample

      - name: Type check tests and webview
        run: |
          npm run typecheck-tests --prefix extensions/gemini
          npx tsc -p extensions/gemini/webview-src/tsconfig.json

      - name: Bundle extension and webview
        run: |
          node extensions/gemini/esbuild.mts
          node extensions/gemini/esbuild.webview.mts

      - name: Install Gemini CLI (${{ matrix.gemini-cli }})
        run: |
          npm install --prefix "$RUNNER_TEMP/gemini-cli" "@google/gemini-cli@${{ matrix.gemini-cli }}"
          echo "GEMINI_CLI_PATH=$RUNNER_TEMP/gemini-cli/node_modules/@google/gemini-cli/bundle/gemini.js" >> "$GITHUB_ENV"

      - name: Unit tests and gemini --acp initialize
        run: npm test --prefix extensions/gemini

  compile:
    name: Compile & hygiene
    needs: changes
    # A skipped job counts as passing for required checks.
    if: needs.changes.outputs.upstream == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Add swap space
        run: |
          sudo fallocate -l 10G /swapfile2
          sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2
          sudo swapon /swapfile2

      - name: Restore node_modules cache
        id: cache-node-modules
        uses: ./.github/actions/restore-node-modules
        with:
          key-prefix: gemini-ci-node_modules-linux
          key-args: "linux x64 $(node -p process.arch)"

      - name: Install build tools
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: sudo apt update -y && sudo apt install -y build-essential pkg-config libx11-dev libx11-xcb-dev libxkbfile-dev libnotify-bin libkrb5-dev

      - name: Install Electron headers
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: node build/npm/preinstall.ts

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: |
          set -e
          for i in {1..3}; do
            npm ci && break
            if [ $i -eq 3 ]; then
              echo "npm ci failed too many times" >&2
              exit 1
            fi
            echo "npm ci failed $i, trying again..."
          done
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save node_modules cache
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        uses: ./.github/actions/save-node-modules

      - name: Prepare Electron types
        run: node build/npm/electronTypes.ts

      - name: Compile
        run: npm run compile

      - name: Hygiene
        run: npm run hygiene
