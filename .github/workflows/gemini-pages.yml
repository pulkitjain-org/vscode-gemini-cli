# The GeminiCode download page on GitHub Pages (see gemini/docs/RELEASING.md).
# Rebuilds gemini/site from the latest GitHub Release whenever a release
# changes, the page's sources change on main, or gemini-release.yml has
# published a release (a release made by a workflow fires no release event,
# so that workflow starts this one by hand). It always deploys from main:
# the github-pages environment accepts only the default branch, and a
# release event runs on its tag, so a release event just restarts this
# workflow on main. Needs Settings → Pages → Source: GitHub Actions.
name: Gemini Pages

on:
  push:
    branches:
      - main
    paths:
      - gemini/site/**
      - gemini/docs/guide/**
      - gemini/branding/icon.svg
      - .github/workflows/gemini-pages.yml
  release:
    types: [published, edited, deleted, unpublished]
  workflow_dispatch:

concurrency:
  group: gemini-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  restart-on-main:
    name: Restart on main
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Run this workflow on main
        run: gh workflow run gemini-pages.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.event.repository.default_branch }}"
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    name: Build the page
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Build
        run: node gemini/site/build.mts "$RUNNER_TEMP/site"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Accessibility and Lighthouse
        # Nothing goes live with an axe violation or a Lighthouse score under its floor (gemini/site/check-*.mjs).
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/site-checks" axe-core@4.10.3 playwright-core@1.49.1 lighthouse@12.6.1
          export NODE_PATH="$RUNNER_TEMP/site-checks/node_modules"
          export CHROME_PATH="$(which google-chrome || which chromium-browser)"
          node gemini/site/check-a11y.mjs "$RUNNER_TEMP/site"
          node gemini/site/check-lighthouse.mjs "$RUNNER_TEMP/site"
          rm -f "$RUNNER_TEMP"/site/lighthouse-*.json

      - name: Upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
