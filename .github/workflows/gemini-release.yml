# GeminiCode release build (see gemini/docs/RELEASING.md).
# Pushing a tag like v1.2.0 builds the Mac app for Apple silicon on macOS 26
# or later (an arm64-only binary that declares macOS 26 as its minimum), signs it
# with the Developer ID in the repository secrets, notarizes and staples it,
# packs a .dmg and publishes it to a GitHub Release. Without the Apple
# secrets the app is only ad-hoc signed and the release is marked unsigned.
# If the release already exists (made in GitHub's UI, say), the .dmg is
# added to it and its title and notes are kept. Every run also keeps the
# .dmg and its checksum as unzipped workflow artifacts. Running the workflow
# by hand builds a dev .dmg and publishes nothing, unless a tag is given:
# then it builds that tag and publishes it, as a tag push would.
name: Gemini Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Build and publish this existing tag, such as v1.1.0. Leave empty for a dev build that publishes nothing.'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  macos:
    name: macOS (Apple silicon)
    runs-on: macos-15
    timeout-minutes: 240
    permissions:
      contents: write # create the GitHub Release
      actions: write # start the download page build
      issues: write # open the benchmark reminder
    env:
      VSCODE_ARCH: arm64
      VSCODE_QUALITY: stable
      # The oldest macOS the app opens on; older releases refuse it and name this one.
      GEMINI_MIN_MACOS: '26.0'
      NPM_CONFIG_AUDIT: false
      NPM_CONFIG_FUND: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Work out the version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-}"
          if [[ -z "$TAG" && "$GITHUB_REF_TYPE" == "tag" ]]; then TAG="$GITHUB_REF_NAME"; fi
          if [[ -n "$TAG" ]]; then
            VERSION="${TAG#v}"
            PUBLISH=true
          else
            VERSION="0.0.0-dev.${GITHUB_RUN_NUMBER}"
            PUBLISH=false
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$VERSION' is not a version like 0.1.0"
            exit 1
          fi
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "publish=$PUBLISH"
          } >> "$GITHUB_OUTPUT"
          echo "Building GeminiCode $VERSION (publish: $PUBLISH)"

      - name: Check the Apple secrets
        id: signing
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          SET=0
          for NAME in MACOS_CERTIFICATE MACOS_CERTIFICATE_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_TEAM_ID; do
            if [[ -n "${!NAME}" ]]; then SET=$((SET + 1)); else MISSING="${MISSING:-} $NAME"; fi
          done
          if [[ $SET -eq 6 ]]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Signing and notarizing with the Developer ID."
          elif [[ $SET -eq 0 ]]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No Apple secrets: building an unsigned app."
          else
            echo "::error::Some Apple secrets are set but these are missing:$MISSING"
            exit 1
          fi

      - name: Stamp the version into product.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            const product = JSON.parse(fs.readFileSync("product.json", "utf8"));
            product.geminiCodeVersion = process.env.VERSION;
            product.geminiCliVersion = require("./extensions/gemini/package.json").bundledCli.version;
            fs.writeFileSync("product.json", JSON.stringify(product, null, "\t") + "\n");
          '

      - name: Install dependencies
        run: |
          set -e
          for i in 1 2 3; do
            npm ci && break
            if [ $i -eq 3 ]; then
              echo "npm ci failed too many times" >&2
              exit 1
            fi
            echo "npm ci failed $i, trying again..."
          done
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Leave out upstream's Copilot extension
        # GeminiCode turns upstream's AI off, and upstream ships Copilot from a prebuilt
        # package its own pipeline makes; built from source here it lacks its runtime.
        run: rm -rf extensions/copilot

      - name: Bundle the Gemini CLI
        run: npm run bundle-cli --prefix extensions/gemini
        env:
          # The pinned SHA-512 vouches for the download; a CLI pinned in its first week
          # must pass the package's min-release-age (bundle-cli.mts also passes this, from v0.1.1).
          npm_config_min_release_age: 0

      - name: Build the app
        run: npm run gulp vscode-darwin-arm64-min
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the app
        id: app
        run: |
          set -euo pipefail
          BUILD_DIR="$(dirname "$GITHUB_WORKSPACE")"
          APP="$BUILD_DIR/VSCode-darwin-arm64/GeminiCode.app"
          RESOURCES="$APP/Contents/Resources/app"
          CLI_VERSION="$(node -p 'require("./extensions/gemini/package.json").bundledCli.version')"
          test -d "$APP" || { echo "::error::$APP was not built"; exit 1; }
          test -f "$RESOURCES/extensions/gemini/cli/$CLI_VERSION/bundle/gemini.js" || { echo "::error::The bundled Gemini CLI is missing from the app"; exit 1; }
          test ! -e "$RESOURCES/extensions/copilot" || { echo "::error::Upstream's Copilot extension is in the app"; exit 1; }
          # shellcheck disable=SC2016 # a JavaScript template string, not shell
          node -e 'const p = require(process.argv[1]); if (p.geminiCodeVersion !== process.argv[2]) { throw new Error(`product.json has ${p.geminiCodeVersion}`); }' "$RESOURCES/product.json" "${{ steps.version.outputs.version }}"
          echo "build-dir=$BUILD_DIR" >> "$GITHUB_OUTPUT"
          echo "path=$APP" >> "$GITHUB_OUTPUT"
          du -sh "$APP"

      - name: Require Apple silicon and macOS 26
        # Electron declares an older minimum and its packager has no option for it, so the app's
        # Info.plist is set here, before signing. macOS then refuses to open the app on an older
        # release and says which it needs; an arm64-only executable does the same on an Intel Mac.
        run: |
          set -euo pipefail
          APP="${{ steps.app.outputs.path }}"
          PLIST="$APP/Contents/Info.plist"
          plutil -replace LSMinimumSystemVersion -string "$GEMINI_MIN_MACOS" "$PLIST"
          MIN="$(plutil -extract LSMinimumSystemVersion raw "$PLIST")"
          test "$MIN" = "$GEMINI_MIN_MACOS" || { echo "::error::LSMinimumSystemVersion is $MIN, not $GEMINI_MIN_MACOS"; exit 1; }
          EXE="$APP/Contents/MacOS/$(plutil -extract CFBundleExecutable raw "$PLIST")"
          ARCHS="$(lipo -archs "$EXE")"
          test "$ARCHS" = "arm64" || { echo "::error::$EXE is built for '$ARCHS', not arm64 only"; exit 1; }
          echo "The app needs Apple silicon (arm64) and macOS $MIN or later."

      - name: Install the layered app icon
        # macOS 26 draws app icons from a compiled icon catalog, with Default, Dark, Clear and
        # Tinted appearances; the packager only knows the classic .icns. gemini/scripts/make-icons.sh
        # compiles gemini/branding/GeminiCode.icon into resources/darwin/Assets.car, and this step
        # puts it in the app and names it, before signing, so the Dock and Finder use it.
        run: |
          set -euo pipefail
          APP="${{ steps.app.outputs.path }}"
          PLIST="$APP/Contents/Info.plist"
          test -f resources/darwin/Assets.car || { echo "::error::resources/darwin/Assets.car is missing; run gemini/scripts/make-icons.sh"; exit 1; }
          test ! -e "$APP/Contents/Resources/Assets.car" || { echo "::error::The app already has an Assets.car; merge the icon into it instead of copying over it"; exit 1; }
          cp resources/darwin/Assets.car "$APP/Contents/Resources/Assets.car"
          plutil -replace CFBundleIconName -string GeminiCode "$PLIST"
          test "$(plutil -extract CFBundleIconName raw "$PLIST")" = "GeminiCode"
          echo "Installed the layered icon as CFBundleIconName GeminiCode (classic icon: $(plutil -extract CFBundleIconFile raw "$PLIST"))."

      - name: Import the Developer ID certificate
        if: steps.signing.outputs.signed == 'true'
        id: keychain
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # build/darwin/sign.ts looks for this keychain in $AGENT_TEMPDIRECTORY.
          KEYCHAIN="$RUNNER_TEMP/buildagent.keychain"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # shellcheck disable=SC2046 # one argument per existing keychain
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep "Developer ID Application" | grep "($APPLE_TEAM_ID)" | grep -oE '[0-9A-F]{40}' | head -n 1 || true)"
          if [[ -z "$IDENTITY" ]]; then
            echo "::error::No 'Developer ID Application' certificate for team $APPLE_TEAM_ID in MACOS_CERTIFICATE"
            security find-identity -v -p codesigning "$KEYCHAIN"
            exit 1
          fi
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"

      - name: Sign the app (Developer ID, hardened runtime)
        if: steps.signing.outputs.signed == 'true'
        env:
          AGENT_TEMPDIRECTORY: ${{ runner.temp }}
          CODESIGN_IDENTITY: ${{ steps.keychain.outputs.identity }}
        run: |
          set -euo pipefail
          DEBUG='electron-osx-sign*' node build/darwin/sign.ts "${{ steps.app.outputs.build-dir }}"
          codesign --verify --deep --strict --verbose=2 "${{ steps.app.outputs.path }}"

      - name: Sign the app (ad hoc)
        if: steps.signing.outputs.signed != 'true'
        run: |
          set -euo pipefail
          # Apple silicon runs no code without a signature; ad hoc is enough to start after the user allows it.
          codesign --force --deep --sign - "${{ steps.app.outputs.path }}"
          codesign --verify --deep --strict --verbose=2 "${{ steps.app.outputs.path }}"

      - name: Write the App Store Connect API key
        if: steps.signing.outputs.signed == 'true'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
          # Accept the .p8 file as is, or base64-encoded.
          if [[ "$APPLE_API_KEY" == *"BEGIN PRIVATE KEY"* ]]; then
            printf '%s\n' "$APPLE_API_KEY" > "$KEY"
          else
            echo "$APPLE_API_KEY" | base64 --decode > "$KEY"
          fi
          chmod 600 "$KEY"
          echo "APPLE_API_KEY_PATH=$KEY" >> "$GITHUB_ENV"

      - name: Notarize and staple the app
        if: steps.signing.outputs.signed == 'true'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          APP="${{ steps.app.outputs.path }}"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/GeminiCode.zip"
          bash gemini/scripts/notarize.sh "$RUNNER_TEMP/GeminiCode.zip"
          xcrun stapler staple "$APP"
          spctl --assess --type execute --verbose=2 "$APP"

      - name: Create the .dmg
        id: dmg
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/dmg"
          mkdir -p "$OUT"
          node build/darwin/create-dmg.ts "${{ steps.app.outputs.build-dir }}" "$OUT"
          NAME="GeminiCode-$VERSION-arm64"
          if [[ "$SIGNED" != "true" ]]; then NAME="$NAME-unsigned"; fi
          mv "$OUT/VSCode-darwin-arm64.dmg" "$OUT/$NAME.dmg"
          echo "path=$OUT/$NAME.dmg" >> "$GITHUB_OUTPUT"
          echo "name=$NAME.dmg" >> "$GITHUB_OUTPUT"

      - name: Sign, notarize and staple the .dmg
        if: steps.signing.outputs.signed == 'true'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          DMG="${{ steps.dmg.outputs.path }}"
          codesign --sign "${{ steps.keychain.outputs.identity }}" --timestamp "$DMG"
          bash gemini/scripts/notarize.sh "$DMG"
          xcrun stapler staple "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"

      - name: Checksum
        id: checksum
        run: |
          set -euo pipefail
          cd "$(dirname "${{ steps.dmg.outputs.path }}")"
          shasum -a 256 "${{ steps.dmg.outputs.name }}" > "${{ steps.dmg.outputs.name }}.sha256"
          cat "${{ steps.dmg.outputs.name }}.sha256"
          echo "path=$PWD/${{ steps.dmg.outputs.name }}.sha256" >> "$GITHUB_OUTPUT"

      # Uploaded as is, not zipped: Chrome can block a .dmg inside a .zip as a dangerous
      # download, while a plain .dmg carries its Apple signature for the browser to check.
      - name: Upload the .dmg as a workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.dmg.outputs.path }}
          archive: false
          retention-days: 14

      - name: Upload the checksum as a workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.checksum.outputs.path }}
          archive: false
          retention-days: 14

      - name: Publish the GitHub Release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          set -euo pipefail
          FILES=("${{ steps.dmg.outputs.path }}" "${{ steps.checksum.outputs.path }}")
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # Made by hand: keep its title and notes, and add (or replace) the files.
            gh release upload "$TAG" "${FILES[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi
          CLI_VERSION="$(node -p 'require("./extensions/gemini/package.json").bundledCli.version')"
          UPSTREAM_VERSION="$(node -p 'require("./package.json").version')"
          NOTES="$RUNNER_TEMP/notes.md"
          {
            echo "GeminiCode $VERSION for Mac with Apple silicon on macOS ${GEMINI_MIN_MACOS%.0} or later, built on Code - OSS $UPSTREAM_VERSION with Gemini CLI $CLI_VERSION."
            echo
            if [[ "$SIGNED" != "true" ]]; then
              echo "> [!WARNING]"
              echo "> This build is not signed or notarized by Apple yet, so macOS blocks it on first launch. After moving GeminiCode to Applications, open it once, then choose **Open Anyway** in **System Settings → Privacy & Security**. Or run \`xattr -dr com.apple.quarantine /Applications/GeminiCode.app\`."
              echo
            fi
            echo "Install: open the .dmg and drag GeminiCode to Applications."
            echo
          } > "$NOTES"
          TITLE="GeminiCode $VERSION"
          if [[ "$SIGNED" != "true" ]]; then TITLE="$TITLE (unsigned)"; fi
          PRERELEASE=""
          if [[ "$VERSION" == *-* ]]; then PRERELEASE="--prerelease"; fi
          gh release create "$TAG" "${FILES[@]}" --repo "$GITHUB_REPOSITORY" \
            --title "$TITLE" --notes-file "$NOTES" --generate-notes --verify-tag $PRERELEASE

      - name: Update the download page
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # A release made with this token fires no release event, so start the page build directly.
        run: gh workflow run gemini-pages.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.event.repository.default_branch }}"

      - name: Open the benchmark reminder
        # The benchmark runs on a developer's Mac under their own seat, since hosted runners cannot sign in to Code Assist
        # (gemini/bench/README.md); this issue is the reminder to run it on release day and add the results by pull request.
        if: steps.version.outputs.publish == 'true' && !contains(steps.version.outputs.version, '-')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          TITLE="Benchmark $VERSION"
          if gh issue list --repo "$GITHUB_REPOSITORY" --state all --search "in:title \"$TITLE\"" --json title --jq '.[].title' | grep -qx "$TITLE"; then
            echo "The issue \"$TITLE\" is already there."
            exit 0
          fi
          CLI_VERSION="$(node -p 'require("./extensions/gemini/package.json").bundledCli.version')"
          BODY="$RUNNER_TEMP/benchmark-issue.md"
          {
            echo "GeminiCode $VERSION is out with Gemini CLI $CLI_VERSION. Run the benchmark on it before the release is announced."
            echo
            echo "1. Install GeminiCode $VERSION from the release, open this repository in it, and sign in with your own seat."
            echo "2. Run **Gemini: Run Benchmark...** from the Command Palette (or the Gemini status menu) once on Flash and once on Pro."
            echo "3. Open a pull request that adds the two files it writes to \`gemini/bench/results/\` and closes this issue."
            echo
            echo "About 900 requests for 30 tasks on two models: keep a full day's work off that seat. The docs site shows the results once the pull request merges."
          } > "$BODY"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file "$BODY"

      - name: Remove the keychain and API key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/buildagent.keychain" 2> /dev/null || true
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8
